services:
  liosam-humble-jammy-container:
    image: liosam_testing:v1.1
    container_name: liosam-humble-jammy-container
    privileged: true
    hostname: liosam-humble-jammy-container
    restart: always
    stdin_open: true
    tty: true
    network_mode: "host"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    environment:
      - "DISPLAY=$DISPLAY"
      - "RMW_IMPLEMENTATION=rmw_cyclonedds_cpp"
      - "CYCLONEDDS_URI=file:///root/ros2_ws/src/LIO-SAM/config/cyclonedds.xml"
      # - "NVIDIA_VISIBLE_DEVICES=all"
      # - "NVIDIA_DRIVER_CAPABILITIES=all"
      # - "FASTRTPS_DEFAULT_PROFILES_FILE=/usr/local/share/middleware_profiles/rtps_udp_profile.xml"
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - "/dev/*:/dev/*"
      - "/home/kartheegeyan/workspace/projects/scdf/liosam_ws/src/LIO-SAM/config/params.yaml:/root/ros2_ws/src/LIO-SAM/config/params.yaml"
      - "/home/kartheegeyan/workspace/projects/scdf/liosam_ws/src/LIO-SAM/launch/run.launch.py:/root/ros2_ws/src/LIO-SAM/launch/run.launch.py"
      - "/home/kartheegeyan/workspace/projects/scdf/liosam_ws/maps/:/root/Downloads/service_LOAM/:rw"
    command: >
      bash -c "source ./install/setup.bash && ros2 launch lio_sam run.launch.py"
